name: Unit Tests & Reports

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :mobile:testDebugUnitTest --continue

      - name: Prepare Reports for Deployment
        if: always()
        run: |
          # Tworzymy strukturę folderów
          mkdir -p public/reports/${{ github.run_id }}
          
          # Kopiujemy raporty z testów
          if [ -d "mobile/build/reports/tests/testDebugUnitTest" ]; then
            cp -r mobile/build/reports/tests/testDebugUnitTest/* public/reports/${{ github.run_id }}/
          fi
          
          # Kopiujemy Privacy Policy
          if [ -f "web/privacy.html" ]; then
            cp web/privacy.html public/privacy.html
          fi
          
          # Tworzymy index.html
          echo "<html>
          <head><title>SportApp Project Pages</title></head>
          <body>
            <h1>SportApp Project Pages</h1>
            <ul>
              <li><a href='privacy.html'>Privacy Policy</a></li>
              <li>Latest Test Report: <a href='./reports/${{ github.run_id }}/index.html'>Run ${{ github.run_id }}</a></li>
            </ul>
          </body>
          </html>" > public/index.html

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true

      - name: Add Link to Job Summary
        if: always()
        run: |
          BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          REPORT_URL="$BASE_URL/reports/${{ github.run_id }}/index.html"
          PRIVACY_URL="$BASE_URL/privacy.html"
          echo "### ✅ Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "🚀 [Privacy Policy]($PRIVACY_URL)" >> $GITHUB_STEP_SUMMARY
          echo "📊 [Unit Test Report]($REPORT_URL)" >> $GITHUB_STEP_SUMMARY