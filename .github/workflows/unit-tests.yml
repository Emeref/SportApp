name: Unit Tests & Reports

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :mobile:testDebugUnitTest :wear:testDebugUnitTest --continue

      - name: Prepare Reports for Deployment
        if: always()
        run: |
          # Czyścimy i tworzymy strukturę
          rm -rf public
          mkdir -p public/reports/${{ github.run_id }}
          
          # Dodajemy .nojekyll aby GitHub nie ignorował plików zaczynających się od podkreślenia
          touch public/.nojekyll
          
          # Kopiujemy raporty z testów (Mobile)
          if [ -d "mobile/build/reports/tests/testDebugUnitTest" ]; then
            cp -r mobile/build/reports/tests/testDebugUnitTest/* public/reports/${{ github.run_id }}/
            echo "✅ Mobile test reports copied"
          fi
          
          # Kopiujemy raporty z testów (Wear) - do osobnego podfolderu jeśli chcemy oba
          if [ -d "wear/build/reports/tests/testDebugUnitTest" ]; then
            mkdir -p public/reports/${{ github.run_id }}/wear
            cp -r wear/build/reports/tests/testDebugUnitTest/* public/reports/${{ github.run_id }}/wear/
            echo "✅ Wear test reports copied"
          fi
          
          # Kopiujemy Privacy Policy
          if [ -f "web/privacy.html" ]; then
            cp web/privacy.html public/privacy.html
            echo "✅ Privacy policy copied"
          else
            echo "⚠️ web/privacy.html NOT FOUND"
          fi
          
          # Tworzymy index.html
          echo "<html>
          <head><title>SportApp Project Pages</title></head>
          <body>
            <h1>SportApp Project Pages</h1>
            <ul>
              <li><a href='privacy.html'>Privacy Policy</a></li>
              <li>Latest Mobile Test Report: <a href='reports/${{ github.run_id }}/index.html'>Run ${{ github.run_id }}</a></li>
              <li>Latest Wear Test Report: <a href='reports/${{ github.run_id }}/wear/index.html'>Run ${{ github.run_id }} (Wear)</a></li>
            </ul>
          </body>
          </html>" > public/index.html

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true

      - name: Add Link to Job Summary
        if: always()
        run: |
          # Wyciągamy nazwę repozytorium bez właściciela
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          BASE_URL="https://${{ github.repository_owner }}.github.io/$REPO_NAME"
          
          echo "### ✅ Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "🚀 **Privacy Policy:** $BASE_URL/privacy.html" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Mobile Unit Test Report:** $BASE_URL/reports/${{ github.run_id }}/index.html" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Wear Unit Test Report:** $BASE_URL/reports/${{ github.run_id }}/wear/index.html" >> $GITHUB_STEP_SUMMARY
